<script>
// The page's errors, and files it couldn't load, go to the app's log
addEventListener('error', event => {
  const text = event.message ? `${event.message} (${event.filename}:${event.lineno})`
    : `Could not load ${event.target?.src ?? event.target?.href}`;
  window.webkit?.messageHandlers?.turntable?.postMessage({type: 'log', text});
}, true);
addEventListener('unhandledrejection', event => {
  window.webkit?.messageHandlers?.turntable?.postMessage({type: 'log', text: String(event.reason)});
});
</script>
