[package]
name = "turntable"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
anyhow = "1"
base64 = "0.22"
bytemuck = { version = "1", features = ["derive"] }
draco_decoder = "0.0.31"
gettext-rs = { version = "0.8", features = ["gettext-system"] }
glam = { version = "0.34", features = ["bytemuck"] }
glow = "0.18"
gtk = { package = "gtk4", version = "0.11", features = ["gnome_48"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = "0.2"
libloading = "0.9"
meshopt = "0.6"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ufbx = "0.11"
zip = { version = "8", default-features = false, features = ["deflate"] }

# Unwinding, not aborting: a loader that panics on a damaged file fails its thread, and the
# window says the file may be damaged
[profile.release]
lto = true
codegen-units = 1

# Image decoding and model parsing are slow unoptimised: keep debug builds usable
[profile.dev.package."*"]
opt-level = 3
